<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Real Life Teddy 🧸</title>
    <style>
        /* CSS: Mobile Optimized Design */
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #ffe6e9;
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            /* Allow vertical scrolling, hide horizontal */
            overflow-x: hidden; 
            display: flex;
            justify-content: center;
            align-items: center; 
        }

        /* Container for hearts so they don't mess up scrolling */
        #heart-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            /* Reduced padding for mobile */
            padding: 25px; 
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px; /* Slightly narrower for phones */
            width: 85%;
            z-index: 10;
            position: relative;
            border: 2px solid #fff0f3;
            /* Ensure margin so it doesn't touch screen edges */
            margin: 20px auto; 
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #ff4d6d;
            font-size: 2rem; /* Slightly smaller font */
            margin-top: 0;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .gallery {
            display: flex;
            justify-content: center;
            gap: 10px; /* Closer together */
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .gallery-img {
            width: 75px; /* Smaller images for mobile */
            height: 75px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #ffccd5;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .gallery-img:hover {
            transform: scale(1.15) rotate(5deg);
            border-color: #ff4d6d;
        }

        p {
            color: #590d22;
            font-size: 1rem; /* Readable mobile size */
            line-height: 1.5;
            margin: 15px 0;
        }

        .highlight {
            color: #ff4d6d;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .btn {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
            margin-top: 10px;
            width: 100%; /* Full width button on mobile looks nice */
            max-width: 200px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 77, 109, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Floating Heart Styles */
        .heart {
            position: absolute;
            bottom: -10px;
            color: #ff4d6d;
            font-size: 24px;
            animation: floatUp 4s linear forwards;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="heart-container"></div>

    <div class="card">
        <h1>Happy Teddy Day! 🧸</h1>
        
        <div class="gallery">
            <img src="my-love.jpg" alt="My Love" class="gallery-img">
            <img src="teddy-day-memoryu.jpg" alt="Memories" class="gallery-img">
            <img src="us-smiling.png" alt="Smiles" class="gallery-img">
        </div>

        <p>
            Who needs a stuffed toy when you have me?<br><br>
            <span class="highlight">I'm your real-life Teddy Bear!</span><br>
            (Limited Edition & Yours Forever)<br><br>
            I promise to be warmer, softer, and more cuddly than any bear in the store.
        </p>

        <button class="btn" onclick="sendLove()">Claim Your Teddy 🎁</button>
    </div>

    <script>
        // JavaScript: The Functionality

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            const shapes = ['❤️', '🧸', '💖', '🎁'];
            heart.innerHTML = shapes[Math.floor(Math.random() * shapes.length)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';

            // Append hearts to the fixed container, NOT the body
            document.getElementById('heart-container').appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(createHeart, 500);

        function sendLove() {
            for(let i=0; i<15; i++) {
                setTimeout(createHeart, i * 100);
            }
            alert("Yay! You are stuck with me now! I love you! ❤️🧸");
        }
    </script>
</body>
</html>

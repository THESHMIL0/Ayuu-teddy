<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Real Life Teddy 🧸</title>
    <style>
        /* CSS: The Design Layer */
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #ffe6e9; /* Soft pink background */
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* Keeps the hearts inside the window */
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            z-index: 10;
            position: relative;
            border: 2px solid #fff0f3;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #ff4d6d;
            font-size: 2.2rem;
            margin-top: 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* --- THE GALLERY STYLES --- */
        .gallery {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .gallery-img {
            width: 90px;
            height: 90px;
            object-fit: cover; /* This makes sure the photo fills the circle neatly */
            border-radius: 50%; /* Makes the photos circular */
            border: 4px solid #ffccd5;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        /* Cute hover effect when you touch a photo */
        .gallery-img:hover {
            transform: scale(1.15) rotate(5deg);
            border-color: #ff4d6d;
        }

        p {
            color: #590d22;
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 20px 0;
        }

        .highlight {
            color: #ff4d6d;
            font-weight: bold;
        }

        .btn {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 77, 109, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Floating Heart Animation */
        .heart {
            position: absolute;
            bottom: -10px;
            color: #ff4d6d;
            font-size: 24px;
            animation: floatUp 4s linear forwards;
            opacity: 0;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Happy Teddy Day! 🧸</h1>
        
        <div class="gallery">
            <img src="my-love.jpg" alt="My Love" class="gallery-img">
            
            <img src="teddy-day-memoryu.png" alt="Memories" class="gallery-img">
            
            <img src="us-smiling.png" alt="Smiles" class="gallery-img">
        </div>

        <p>
            To the cutest person I know,<br>
            <span class="highlight">You make my life so soft and sweet.</span><br>
            Here are some of my favorite moments with you.
            Sending you a giant bear hug!
        </p>

        <button class="btn" onclick="sendLove()">Accept Hug 🤗</button>
    </div>

    <script>
        // JavaScript: The Functionality

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            // Randomly choose between a Heart or a Teddy Bear emoji
            const shapes = ['❤️', '🧸', '💖'];
            heart.innerHTML = shapes[Math.floor(Math.random() * shapes.length)];
            
            // Randomize position (left to right)
            heart.style.left = Math.random() * 100 + 'vw';
            
            // Randomize size
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            
            // Randomize speed
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        // Start the background hearts
        setInterval(createHeart, 500);

        // What happens when she clicks the button
        function sendLove() {
            // A burst of hearts!
            for(let i=0; i<15; i++) {
                setTimeout(createHeart, i * 100);
            }
            alert("Hug accepted! I love you! ❤️🧸");
        }
    </script>
</body>
</html>
